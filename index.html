<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Happy Birthday Vertika</title>

<style>
body {
  margin: 0;
  height: 100vh;
  background: linear-gradient(to top, #ffdde1, #ee9ca7);
  overflow: hidden;
  font-family: 'Segoe UI', sans-serif;
}

/* Birthday Message */
.message {
  position: absolute;
  top: 20px;
  width: 100%;
  text-align: center;
  color: white;
  opacity: 0;
  transition: opacity 3s ease;
  z-index: 5;
}

.message h1 {
  font-size: 34px;
  margin: 0;
  text-shadow: 2px 2px 5px #000;
}

.message p {
  font-size: 17px;
  margin: 6px 0;
  text-shadow: 1px 1px 4px #000;
}

/* SVG Tree */
svg {
  position: absolute;
  bottom: -40px; /* pushes tree down */
  width: 100%;
  height: 100%;
}

/* Tree drawing animation */
.trunk, .branch {
  fill: none;
  stroke: #8b5a2b;
  stroke-linecap: round;
  stroke-dasharray: 1400;
  stroke-dashoffset: 1400;
  animation: drawTree 5s ease forwards;
}

.branch { animation-delay: 1.5s; }

/* Heart leaves */
.leaf {
  opacity: 0;
  animation: showLeaf 0.3s forwards;
}

@keyframes drawTree {
  to { stroke-dashoffset: 0; }
}

@keyframes showLeaf {
  to { opacity: 1; }
}
</style>
</head>

<body>

<div class="message" id="msg">
  <h1>Happy Birthday Shabnam di </h1>
  <p>May your life always bloom with happiness </p>
  <p>— Yours lovingly, Nishant </p>
</div>

<svg viewBox="0 0 360 640" preserveAspectRatio="xMidYMax meet">

  <!-- Trunk (lowered & tall) -->
  <path class="trunk"
        d="M180 640 C145 500, 215 340, 180 220"
        stroke-width="22"/>

  <!-- 8 Curved Branches -->
  <path class="branch" d="M180 420 C95 380, 70 330, 50 300" stroke-width="7"/>
  <path class="branch" d="M180 420 C265 380, 290 330, 310 300" stroke-width="7"/>

  <path class="branch" d="M180 360 C120 330, 105 285, 95 255" stroke-width="6"/>
  <path class="branch" d="M180 360 C240 330, 255 285, 265 255" stroke-width="6"/>

  <path class="branch" d="M180 310 C145 285, 135 245, 125 220" stroke-width="5"/>
  <path class="branch" d="M180 310 C215 285, 225 245, 235 220" stroke-width="5"/>

  <path class="branch" d="M180 270 C165 245, 155 220, 150 200" stroke-width="4"/>
  <path class="branch" d="M180 270 C195 245, 205 220, 210 200" stroke-width="4"/>

  <!-- Heart Leaves -->
  <g id="leaves"></g>

</svg>

<audio id="bgMusic" loop>
  <source src="music.mp3" type="audio/mpeg">
</audio>

<script>
/* Heart leaves attached to canopy */
const colors = ["#ff4d4d","#ff66cc","#ffcc00","#66ff99","#66ccff","#ff9966","#cc66ff"];
const leavesGroup = document.getElementById("leaves");

/* Canopy positioned LOWER so text stays clear */
const centerX = 180;
const centerY = 260;   // moved down
const radius = 170;    // covers all branches

let baseDelay = 3500;

for (let i = 0; i < 200; i++) {
  const angle = Math.random() * Math.PI * 2;
  const r = radius * Math.sqrt(Math.random());

  const x = centerX + r * Math.cos(angle);
  const y = centerY + r * Math.sin(angle);

  const heart = document.createElementNS("http://www.w3.org/2000/svg", "path");
  heart.setAttribute(
    "d",
    `M ${x} ${y}
     c -5 -7 -14 -3 -14 5
     c 0 7 14 14 14 14
     s 14 -7 14 -14
     c 0 -7 -9 -12 -14 -5`
  );

  heart.setAttribute("fill", colors[Math.floor(Math.random() * colors.length)]);
  heart.setAttribute("class", "leaf");
  heart.style.animationDelay = (baseDelay + i * 25) + "ms";

  leavesGroup.appendChild(heart);
}

/* Show message after tree completes */
setTimeout(() => {
  document.getElementById("msg").style.opacity = 1;
}, 11000);
</script>

</body>
</html>
